name: CI Pipeline - Healthcare Booking App

on:
  push:
    branches:
      - main
      - feature-login-page
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verify project files exist
        run: |
          echo "Checking required files..."
          test -f index.html && echo "index.html found" || exit 1
          test -f style.css && echo "style.css found" || exit 1
          test -f README.md && echo "README.md found" || exit 1

  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Simulate HTML validation
        run: |
          echo "Running HTML structure checks..."
          grep -q "<form>" index.html && echo "Form tag present" || exit 1
          grep -q "<button>" index.html && echo "Button present" || exit 1
          grep -q "<h1>" index.html && echo "Heading present" || exit 1

      - name: Simulate security header check
        run: |
          echo "Checking for basic security markers..."
          grep -q "password" index.html && echo "Password field detected" || echo "Warning: No password field"
          echo "Security check complete"

  notify:
    name: Pipeline Status Notification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Notify success
        run: echo "Pipeline passed successfully. Ready for review."